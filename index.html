    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ItemList","name":"Every Brandon Sanderson book in release order","numberOfItems":104,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Book","name":"Elantris","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Prince Raoden of Arelon wakes to find himself struck by the Shaod — the transformation that once made men gods and now leaves them undying wrecks — and is secretly cast into the rotting city of Elantris. While he fights to build hope inside a city of the damned, Princess Sarene of Teod arrives to discover her betrothed is 'dead' and takes on the scheming priest Hrathen, who has been given a hundred days to convert the kingdom or see it destroyed. Sanderson's debut novel is a self-contained tale of faith, politics, and a magic system with a broken heart, and it remains one of the best single-volume entry points into the Cosmere.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2005","isPartOf":{"@type":"BookSeries","name":"Elantris"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.19,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765381028","https://coppermind.net/wiki/Elantris"]}},{"@type":"ListItem","position":2,"item":{"@type":"Book","name":"The Hope of Elantris","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A companion short story set during the climactic hours of Elantris, following Matisse, a young girl responsible for the children of New Elantris as soldiers descend on the city. It is a small, warm story about quiet heroism — the people who protect others while the heroes are busy saving the world. Best read after the novel, as it spoils its ending.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2006","isPartOf":{"@type":"BookSeries","name":"Elantris"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.91,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/The_Hope_of_Elantris"]}},{"@type":"ListItem","position":3,"item":{"@type":"Book","name":"Mistborn: The Final Empire","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"For a thousand years ash has fallen from the sky, the Skaa have slaved in misery, and the immortal Lord Ruler has reigned unchallenged — until Kelsier, the only man to ever escape the Pits of Hathsin, decides to pull off the ultimate heist: overthrow God. He recruits Vin, a distrustful street thief who is only beginning to discover she is Mistborn, able to burn metals for superhuman power. Equal parts Ocean's Eleven and epic fantasy, The Final Empire is the perfect first Sanderson novel: a complete story with one of the most satisfying magic systems ever devised.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2006","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.47,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765377136","https://coppermind.net/wiki/The_Final_Empire"]}},{"@type":"ListItem","position":4,"item":{"@type":"Book","name":"The Well of Ascension","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Lord Ruler is dead, and now comes the hard part: ruling. While Elend Venture tries to hold Luthadel with philosophy and a fragile assembly, three armies march on the city, the mists begin killing, and Vin is haunted by rumors of the Well of Ascension — and by a thumping power that calls her north. A masterclass in the question every revolution ignores: what do you do after you win?","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2007","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.38,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765377144","https://coppermind.net/wiki/The_Well_of_Ascension"]}},{"@type":"ListItem","position":5,"item":{"@type":"Book","name":"Alcatraz Versus the Evil Librarians","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On his thirteenth birthday, foster kid Alcatraz Smedry receives his inheritance: a bag of sand, which is promptly stolen by the evil Librarians who secretly control the world's information. It turns out his talent for breaking things is actually a magical Talent, his family are freedom fighters, and the sand is the key to everything. A gleefully absurd middle-grade comedy in which Sanderson mocks fantasy conventions, authors, and himself in equal measure.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2007","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.96,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765378949"]}},{"@type":"ListItem","position":6,"item":{"@type":"Book","name":"The Hero of Ages","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The world is literally ending: ash chokes the sky, the mists kill by day, and Ruin — the power Vin unknowingly freed — works to unmake everything. As Elend and Vin race to decode the Lord Ruler's hidden caches and Sazed grieves through a crisis of faith, every prophecy, plot thread, and offhand detail from the trilogy snaps into place. The Hero of Ages has one of the most celebrated endings in modern fantasy — an all-timer finale that recontextualizes everything before it.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2008","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.51,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765377152","https://coppermind.net/wiki/The_Hero_of_Ages"]}},{"@type":"ListItem","position":7,"item":{"@type":"Book","name":"Alcatraz Versus the Scrivener's Bones","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Alcatraz infiltrates the Library of Alexandria — a deathtrap staffed by soul-hungry undead Curators — in search of his missing father and grandfather. Armed only with his Talent for breaking things and a family of eccentric Smedrys, he faces a half-metal hunter called the Scrivener's Bone. The jokes get better, the lore gets weirder, and the footnotes get more hostile.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2008","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.09,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765378965"]}},{"@type":"ListItem","position":8,"item":{"@type":"Book","name":"Defending Elysium","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Centuries before Skyward, the Phone Company holds a monopoly on faster-than-light communication and humanity's uneasy place among the stars. Jason Write, a blind operative with senses far beyond sight, is sent to Elysium to contain an incident that could shatter the fragile peace with alien species. This novella quietly lays the foundations of the entire Cytoverse — cytonics, the Superiority's fear of humanity, all of it starts here.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2008","aggregateRating":{"@type":"AggregateRating","ratingValue":4.12,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":9,"item":{"@type":"Book","name":"Firstborn","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Dennison Crestmar was born to be a military genius — his brother Varion is the greatest admiral the High Empire has ever known, undefeated in every battle. Dennison, unfortunately, is hopeless. A sharp little space-opera short about living in a legend's shadow, and what an empire does when its perfect weapon stops obeying.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2008","aggregateRating":{"@type":"AggregateRating","ratingValue":4.05,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":10,"item":{"@type":"Book","name":"Warbreaker","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Two Idrian princesses are thrown into the vibrant, dangerous city of T'Telir: Siri, sent to marry the terrifying God King, and Vivenna, who follows to save her. Around them move Lightsong, a god who doesn't believe in his own divinity, and Vasher, a scruffy swordsman carrying Nightblood — a sentient blade created to destroy evil that is far too enthusiastic about its job. Warbreaker is Sanderson at his most colorful, literally: its BioChromatic magic runs on breath and color, and its ending reshapes what you thought the story was about.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2009","aggregateRating":{"@type":"AggregateRating","ratingValue":4.38,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0575097469","https://coppermind.net/wiki/Warbreaker"]}},{"@type":"ListItem","position":11,"item":{"@type":"Book","name":"Alcatraz Versus the Knights of Crystallia","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Alcatraz finally reaches Nalhalla, the Free Kingdoms' capital, only to discover he is already famous — there are books about him, most of them wrong. Between celebrity, politics, and a treaty that would hand the kingdom of Mokia to the Librarians, he learns that being a legend is mostly paperwork and betrayal. The series' satire of fame and authorship at its sharpest.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2009","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.16,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765378981"]}},{"@type":"ListItem","position":12,"item":{"@type":"Book","name":"The Gathering Storm","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The first of the three Wheel of Time volumes Sanderson completed from Robert Jordan's notes after his passing. As the Last Battle looms, Rand al'Thor hardens into something cold and dangerous while Egwene al'Vere, captive in the White Tower, wages a war of pure conviction against Elaida — and against a Seanchan raid that changes everything. Egwene's storyline here is widely considered one of the high points of the entire fourteen-book saga.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2009","isPartOf":{"@type":"BookSeries","name":"The Wheel of Time"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.43,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":13,"item":{"@type":"Book","name":"The Way of Kings","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On the storm-wracked world of Roshar, where war is fought over shattered plains for gemhearts and honor is a forgotten word, three lives converge: Kaladin, a brilliant soldier betrayed into slavery who carries bridges into arrow-storms; Dalinar Kholin, a warlord haunted by visions commanding him to unite them; and Shallan, a scholar whose desperate theft hides a darker secret. The opening movement of the Stormlight Archive is a slow-burn masterpiece that builds to one of fantasy's great crescendos — Bridge Four alone is worth the page count.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2010","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.65,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765376679","https://coppermind.net/wiki/The_Way_of_Kings"]}},{"@type":"ListItem","position":14,"item":{"@type":"Book","name":"Towers of Midnight","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The penultimate Wheel of Time volume. While Rand embraces a hard-won peace with himself, Perrin Aybara is hunted by Slayer and a looming trial, and Mat Cauthon gambles his way into the Tower of Ghenjei to pay a debt to the Aelfinn and Eelfinn. The board is set for the Last Battle; nearly every beloved character gets their moment to step into place.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2010","isPartOf":{"@type":"BookSeries","name":"The Wheel of Time"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.52,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765325942"]}},{"@type":"ListItem","position":15,"item":{"@type":"Book","name":"Alcatraz Versus the Shattered Lens","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Librarians lay siege to Mokia, and Alcatraz — armed with exploding teddy bears and a Talent for breaking everything — decides the kingdom will not fall on his watch. Beneath the pink-bunny absurdity is a surprisingly sincere story about sacrifice, and the cliffhanger reveal stings for real.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2010","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.23,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765379007"]}},{"@type":"ListItem","position":16,"item":{"@type":"Book","name":"I Hate Dragons","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A short comedy told almost entirely in dialogue: Skip is a squire whose scent is irresistible to dragons, which makes him the kingdom's most valuable — and most reluctant — piece of live bait. Originally written as a free writing-sample exercise, it's five minutes of pure Sanderson wit, complete with pedantic arguments about grammar mid-dragon-attack.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2011","aggregateRating":{"@type":"AggregateRating","ratingValue":3.86,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":17,"item":{"@type":"Book","name":"Infinity Blade: Awakening","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Written as a bridge between the first two Infinity Blade video games: Siris has done the impossible and slain the God King, only to inherit his castle, his enemies, and the question of why the world's immortals have kept humanity in a medieval dark age. A fast, punchy tie-in novella that adds real mythology to the games' endless duels.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2011","isPartOf":{"@type":"BookSeries","name":"Infinity Blade"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.91,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":18,"item":{"@type":"Book","name":"The Alloy of Law","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Three centuries after the Mistborn trilogy, Scadrial has railroads, skyscrapers, and revolvers — and Waxillium Ladrian, a frontier lawman dragged back to the city to play lord. When a gang called the Vanishers starts robbing impossible trains and kidnapping noblewomen, Wax straps his guns back on alongside Wayne, fantasy's greatest hat-collecting con man. A breezy, banter-filled western that quietly sets up the future of the entire Cosmere.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2011","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.19,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0575105836","https://coppermind.net/wiki/The_Alloy_of_Law"]}},{"@type":"ListItem","position":19,"item":{"@type":"Book","name":"The Eleventh Metal","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Before Kelsier was the Survivor of Hathsin, he was an angry, newly Snapped Mistborn being trained by the half-mad Gemmel. This short story shows his first faltering steps with Allomancy — and the first hints of the plan that would one day topple an empire.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2011","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.96,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/The_Eleventh_Metal"]}},{"@type":"ListItem","position":20,"item":{"@type":"Book","name":"Heuristic Algorithm and Reasoning Response Engine","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A military science-fiction short co-written with Ethan Skarstedt for the Armored anthology: a soldier and his heavily armed mech AI partner drop into a warzone where the machine's rigid logic and the human's instincts have to learn to trust each other. A rare glimpse of Sanderson doing straight-up mech combat SF.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2012","aggregateRating":{"@type":"AggregateRating","ratingValue":3.85,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":21,"item":{"@type":"Book","name":"Legion","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Stephen Leeds is perfectly sane — it's his hallucinations that are crazy. Every skill he has ever studied manifests as an 'aspect', a fully realized imaginary person who follows him around: a weapons expert, a linguist, a paranoid cryptographer. When he's hired to recover a camera that photographs the past, his internal committee gets its strangest case yet. A zippy, high-concept novella that reads like a TV pilot in the best way.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2012","isPartOf":{"@type":"BookSeries","name":"Legion"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.21,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473230098"]}},{"@type":"ListItem","position":22,"item":{"@type":"Book","name":"The Emperor's Soul","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Shai is a Forger, an artist who can rewrite an object's history with a stamp — a craft her captors call blasphemy right up until they need it. With the emperor brain-dead after an assassination attempt, she is given a hundred days to forge him a new soul, an impossible act of art and empathy performed under a death sentence. Winner of the Hugo Award for Best Novella and arguably the finest thing Sanderson has ever written.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2012","aggregateRating":{"@type":"AggregateRating","ratingValue":4.46,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1616960922","https://coppermind.net/wiki/The_Emperor%27s_Soul"]}},{"@type":"ListItem","position":23,"item":{"@type":"Book","name":"A Memory of Light","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Last Battle, at last. Every nation, every character, and every promise from fourteen volumes and twenty-three years converges on Tarmon Gai'don as Rand al'Thor walks into Shayol Ghul to face the Dark One. The single longest battle sequence in fantasy publishing, and a genuinely earned farewell to one of the genre's foundational sagas — completed by Sanderson from Robert Jordan's notes.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"The Wheel of Time"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.56,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765337851"]}},{"@type":"ListItem","position":24,"item":{"@type":"Book","name":"The Rithmatist","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"In a gearpunk alternate America of floating springrail trains, Rithmatists defend humanity by dueling with living two-dimensional chalk drawings. Joel, a chalkmaker's son at an elite academy, understands Rithmatic theory better than anyone — but wasn't chosen to use it. When students begin disappearing, leaving only blood and wild chalklings, he and the remedial Rithmatist Melody investigate. Sanderson's most inventive YA magic system, full stop.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"The Rithmatist"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.22,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765338440"]}},{"@type":"ListItem","position":25,"item":{"@type":"Book","name":"River of Souls","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A deleted sequence from A Memory of Light, published in the Unfettered anthology: Demandred in the land of Shara, forging an empire and an army for the Last Battle under the name Bao the Wyld. Essential reading for anyone who finished the Wheel of Time asking 'where did HE come from?'","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"The Wheel of Time"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.15,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":26,"item":{"@type":"Book","name":"Infinity Blade: Redemption","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The second Infinity Blade tie-in novella. Siris and the God King — enemies across a thousand duels — find themselves imprisoned together, while Isa investigates the mysterious Worker of Secrets and the true machinery behind their deathless world. Concludes the story between the games with genuine revelations about the setting's science-fantasy core.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"Infinity Blade"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.11,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0983943036"]}},{"@type":"ListItem","position":27,"item":{"@type":"Book","name":"Steelheart","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"One day Calamity appeared in the sky, and ordinary people gained the powers of gods — and every single one of them became a monster. David Charleston watched the invincible Epic Steelheart murder his father, and he has spent ten years cataloguing the one thing no one else believes: every Epic has a weakness. Now he wants in with the Reckoners, the only humans still fighting back. Revenge-driven, gadget-filled superhero noir with a killer premise.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"The Reckoners"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.13,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0385743572"]}},{"@type":"ListItem","position":28,"item":{"@type":"Book","name":"Mitosis","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A short Reckoners interlude between Steelheart and Firefight. Newcago's fragile freedom is tested by Mitosis, an Epic who can duplicate himself endlessly — and whose weakness is buried in something as fragile as a memory of music. A quick, satisfying bonus round for fans of the trilogy.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","isPartOf":{"@type":"BookSeries","name":"The Reckoners"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.75,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473209358"]}},{"@type":"ListItem","position":29,"item":{"@type":"Book","name":"Shadows for Silence in the Forests of Hell","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On Threnody, the dead do not leave — the Forests are thick with shades that kill at the touch of fire, fast movement, or spilled blood. Silence Montane runs a waystop inn by day and collects bounties on the Forests' worst men by night, using the shades themselves as her weapon. A tense, horror-inflected novella that many readers rank among the Cosmere's very best short work.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2013","aggregateRating":{"@type":"AggregateRating","ratingValue":4.24,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/Shadows_for_Silence_in_the_Forests_of_Hell"]}},{"@type":"ListItem","position":30,"item":{"@type":"Book","name":"Words of Radiance","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The second Stormlight Archive volume turns everything up: Kaladin, now bodyguard to the very lighteyes he distrusts, wrestles with an oath that could break him; Shallan travels to the Shattered Plains carrying her family's ruin and a scholar's mission to stop the Voidbringers' return; and Szeth, the Assassin in White, comes for Dalinar. It builds through a duel gone wrong and a doomed expedition to a confrontation in a storm that fans still argue is the series' single best climax.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.75,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765365286","https://coppermind.net/wiki/Words_of_Radiance"]}},{"@type":"ListItem","position":31,"item":{"@type":"Book","name":"Dreamer","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A dark little short story from the Games Creatures Play anthology: disembodied spirits play a lethal game of tag across a city, stealing bodies like getaway cars. Short, nasty, and clever — Sanderson in rare horror mode.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","aggregateRating":{"@type":"AggregateRating","ratingValue":3.52,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":32,"item":{"@type":"Book","name":"Sixth of the Dusk","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On the island of Patji — a god that kills its worshippers — the trapper Dusk hunts with Aviar, birds whose companionship grants supernatural gifts. When he finds evidence that offworld traders are about to render his entire way of life extinct, he must decide what survival means for his people. A haunting far-future Cosmere novella about colonialism, tradition, and very smart birds.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","aggregateRating":{"@type":"AggregateRating","ratingValue":4.3,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/Sixth_of_the_Dusk"]}},{"@type":"ListItem","position":33,"item":{"@type":"Book","name":"Allomancer Jak and the Pits of Eltania","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"An in-world pulp adventure serial from Scadrial's broadsheets: the gentleman adventurer Allomancer Jak recounts his heroic escapades among the koloss — as annotated by his long-suffering Terris editor Handerwym, whose footnotes dismantle every exaggeration. The funniest thing in the Mistborn canon.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.9,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/Allomancer_Jak_and_the_Pits_of_Eltania"]}},{"@type":"ListItem","position":34,"item":{"@type":"Book","name":"The Way of Kings Prime","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"An excerpt from Sanderson's 2002 first attempt at The Way of Kings, published in the Altered Perceptions charity anthology. A fascinating artifact for Stormlight fans: same world, same names, radically different book.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","isPartOf":{"@type":"BookSeries","name":"Sanderson Curiosities"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.3,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":35,"item":{"@type":"Book","name":"Legion: Skin Deep","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Stephen Leeds and his hallucinated aspects return to recover a stolen corpse whose cells have been encoded with data worth killing for. Biotech espionage, an assassin who knows exactly how to rattle Stephen's inner committee, and more of the aspects' bickering that made the first novella sing.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2014","isPartOf":{"@type":"BookSeries","name":"Legion"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.2,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":36,"item":{"@type":"Book","name":"Firefight","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"David killed Steelheart, and Newcago is free — but the answers he wants are in Babilar, the flooded, glowing ruin of Manhattan ruled by the water-wielding Epic Regalia. There he faces a harder question: if every Epic is corrupted by their power, what about Firefight, the one he can't stop thinking about? Bigger, stranger, and more neon than the first book.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2015","isPartOf":{"@type":"BookSeries","name":"The Reckoners"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.25,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0593307135"]}},{"@type":"ListItem","position":37,"item":{"@type":"Book","name":"Perfect State","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Kairominas is God-Emperor of his world: he has mastered its magic, conquered its kingdoms, and defeated his nemesis. He is also, technically, a brain in a jar — every human lives in their own tailored simulation, and the machines have decided it's time for him to meet a woman from another State. A sharp, twisty novella about power fantasies that knows exactly what it's poking at.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2015","aggregateRating":{"@type":"AggregateRating","ratingValue":4.18,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":38,"item":{"@type":"Book","name":"Shadows of Self","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Wax and Wayne's second outing goes darker: a kandra — one of the immortal shapeshifters that served the Lord Ruler — has gone rogue, and its killings are engineered to set the city of Elendel on fire. The mystery is sharp, the banter is intact, and the final-page gut punch is one of the cruelest things Sanderson has ever done to a character (and to his readers).","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2015","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.31,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473208238","https://coppermind.net/wiki/Shadows_of_Self"]}},{"@type":"ListItem","position":39,"item":{"@type":"Book","name":"Elantris 10th Anniversary Edition","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The definitive edition of Sanderson's debut, released for its tenth anniversary: revised text with author corrections, new maps of Sel, expanded annotations, and bonus material. If you're going to read Elantris today, this is the version to read.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2015","aggregateRating":{"@type":"AggregateRating","ratingValue":4.22,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":40,"item":{"@type":"Book","name":"The Bands of Mourning","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A kandra researcher returns with images of the Bands of Mourning — the mythical metalminds of the Lord Ruler himself, said to grant anyone who wields them the full powers of a Mistborn. Wax, Wayne, Marasi, and the magnificent Steris head south into unexplored territory, where they find airships, new cultures, and revelations that blow the doors off Scadrial's future. Steris quietly steals the entire book.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.4,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473208270","https://coppermind.net/wiki/The_Bands_of_Mourning"]}},{"@type":"ListItem","position":41,"item":{"@type":"Book","name":"Mistborn: Secret History","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The story running underneath the original Mistborn trilogy, told from the other side of death. Saying more spoils both this and the trilogy — but if you've ever wanted to see the Cosmere's cosmology laid bare, this novella is where Sanderson finally shows his cards. Read it after The Bands of Mourning; the Survivor demands it.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.39,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473225043","https://coppermind.net/wiki/Mistborn:_Secret_History"]}},{"@type":"ListItem","position":42,"item":{"@type":"Book","name":"Calamity","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Reckoners finale: Prof, the man who taught David that Epics could be fought, has fallen to his own power. To save him, David leads the Reckoners against the salt-shifting city of Ildithia and toward Calamity itself — the source of every Epic and every corruption. Ends the trilogy with answers, audacity, and a very large number of explosions.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"The Reckoners"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.2,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0385743610"]}},{"@type":"ListItem","position":43,"item":{"@type":"Book","name":"White Sand Volume 1","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On Taldain, a world locked with one face to the sun, sand masters weave glowing ribbons of sand into weapons and tools. Kenton, the weakest sand master ever to take the trials, becomes the only one left standing when the entire Diem is massacred — and must claim its leadership or watch the art die. A graphic-novel adaptation of Sanderson's unpublished early novel and a Cosmere world you can't visit anywhere else.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"White Sand"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.85,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1606908855","https://coppermind.net/wiki/White_Sand_(graphic_novel)"]}},{"@type":"ListItem","position":44,"item":{"@type":"Book","name":"The Dark Talent","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Alcatraz's fifth misadventure takes him into the Highbrary — the Librarians' fortress vault hidden under Washington D.C. — to stop his own father's plan to give everyone Smedry Talents. The most self-aware book in a deeply self-aware series, and it ends on the cliff-hangeriest cliffhanger Sanderson has ever written (he apologizes for it constantly).","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.28,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0765381400"]}},{"@type":"ListItem","position":45,"item":{"@type":"Book","name":"Arcanum Unbounded","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The essential Cosmere collection: The Emperor's Soul, Shadows for Silence, Sixth of the Dusk, Mistborn: Secret History, the Stormlight novella Edgedancer, and more — each with an in-world essay on its star system by the worldhopper Khriss, plus original star charts. This is where the Cosmere's connective tissue becomes visible; casual readers become lore obsessives here.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"The Cosmere Collection"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.54,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473218055","https://coppermind.net/wiki/Arcanum_Unbounded:_The_Cosmere_Collection"]}},{"@type":"ListItem","position":46,"item":{"@type":"Book","name":"Edgedancer","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Lift — thief, pancake enthusiast, and the most reluctant Knight Radiant on Roshar — arrives in the city of Yeddaw with her invisible companion Wyndle, planning to steal food and avoid destiny. Instead she finds Darkness, the implacable herald-turned-executioner hunting people like her. The Cosmere's most joyful character in a novella that sneaks real emotional weight under the jokes. Read between Words of Radiance and Oathbringer.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2016","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.25,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250166543","https://coppermind.net/wiki/Edgedancer"]}},{"@type":"ListItem","position":47,"item":{"@type":"Book","name":"Snapshot","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Detectives Davis and Chaz work inside Snapshots — perfect physical re-creations of a single past day, rebuilt so police can walk through crimes as they happened. When they stumble onto evidence of a murder nobody reported, the case starts bending the rules of what's real. A tight SF-noir novella with a final twist Sanderson fans still bring up.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2017","aggregateRating":{"@type":"AggregateRating","ratingValue":3.95,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1473224993"]}},{"@type":"ListItem","position":48,"item":{"@type":"Book","name":"Oathbringer","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Dalinar Kholin unites the world's monarchs inside the ancient tower-city of Urithiru just as the Everstorm wakes an enemy that has waited millennia — and his own buried past begins to surface. The flashback thread here is devastating: the Blackthorn's true history recontextualizes the man trying to write a better ending for himself. Builds to the Battle of Thaylen Field and the single most quoted moment in the series: 'You cannot have my pain.'","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2017","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.62,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250297141","https://coppermind.net/wiki/Oathbringer"]}},{"@type":"ListItem","position":49,"item":{"@type":"Book","name":"White Sand Volume 2","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Kenton's fight to save the Diem continues as political enemies circle and the investigation into the massacre deepens — while Khriss, the mysterious scholar from the world's darkside, pursues questions with Cosmere-sized answers. The middle chapter of the Taldain graphic novel trilogy.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2018","isPartOf":{"@type":"BookSeries","name":"White Sand"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.9,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/152411152X","https://coppermind.net/wiki/White_Sand_(graphic_novel)"]}},{"@type":"ListItem","position":50,"item":{"@type":"Book","name":"Legion: Lies of the Beholder","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The final Legion novella: Sandra — the woman who taught Stephen to control his aspects, then vanished — sends a message, and his carefully balanced inner world begins to collapse. A surprisingly moving finale about what happens when the imaginary people who keep you functional start to leave.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2018","isPartOf":{"@type":"BookSeries","name":"Legion"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.15,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":51,"item":{"@type":"Book","name":"Legion: The Many Lives of Stephen Leeds","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"All three Legion novellas — Legion, Skin Deep, and Lies of the Beholder — collected in one volume: the complete case files of Stephen Leeds and the hallucinated experts who share his life. The ideal format for one of Sanderson's most purely fun non-Cosmere creations.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2018","isPartOf":{"@type":"BookSeries","name":"Legion"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.25,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":52,"item":{"@type":"Book","name":"Skyward","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Spensa Nightshade has wanted to fly since childhood — but on the cavern-world Detritus, where humanity's remnant hides from alien bombardment, her dead father's name is a curse: coward. Clawing her way into flight school, she finds a decrepit talking starfighter named M-Bot, a slug that says 'doomslug', and the truth about what really happened in her father's final flight. Top Gun by way of epic fantasy pacing; the found-family squadron chapters are irresistible.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2018","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.52,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0399555803"]}},{"@type":"ListItem","position":53,"item":{"@type":"Book","name":"Children of the Nameless","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Sanderson's official Magic: The Gathering novella, free to read and beloved by both fandoms: when every soul in a village vanishes overnight, young Tacenda's cursed song leads her to Davriel Cane — a devastatingly lazy planeswalker who has contractually acquired several demons and would very much like to not be a hero. Wry, gothic, and set on Innistrad, MTG's horror plane.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2018","aggregateRating":{"@type":"AggregateRating","ratingValue":4.33,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":54,"item":{"@type":"Book","name":"A Fire Within the Ways","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A substantial deleted sequence from A Memory of Light, published in the Unfettered III anthology: Perrin's alternate storyline within the Ways during the Last Battle. A genuine lost chapter of the Wheel of Time's finale for completionists.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2019","isPartOf":{"@type":"BookSeries","name":"The Wheel of Time"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.1,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":55,"item":{"@type":"Book","name":"White Sand Volume 3","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The conclusion of the Taldain trilogy: Kenton faces the final vote on the Diem's survival while assassins, politics, and the truth behind the massacre converge. Closes the graphic novel arc — and the Omnibus edition later revised and completed the story's definitive form.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2019","isPartOf":{"@type":"BookSeries","name":"White Sand"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.02,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1524112933","https://coppermind.net/wiki/White_Sand_(graphic_novel)"]}},{"@type":"ListItem","position":56,"item":{"@type":"Book","name":"Starsight","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Spensa gets the chance no human has had in decades: a stolen identity and a seat inside Starsight, the Superiority's gleaming space station, where 'aggressive' species like hers are caged. Undercover and utterly alone, she discovers her enemies have citizens, families — and their own terror: the delvers, planet-killing horrors from the nowhere. A sequel that risks everything by leaving Detritus behind, and wins the bet.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2019","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.38,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0399555846"]}},{"@type":"ListItem","position":57,"item":{"@type":"Book","name":"Dark One Book 1","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Paul Tanasin has visions of Mirandus, a fantasy world where he is prophesied to become the Dark One — the destroyer. Rather than deny it, he decides to weaponize it. A graphic novel that inverts the chosen-one story: what if the boy of prophecy read the prophecy and said 'fine'? Moody art, sharp premise, and a very un-Sanderson edge.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2020","isPartOf":{"@type":"BookSeries","name":"Dark One"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.14,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":58,"item":{"@type":"Book","name":"The Way of Kings Prime","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Sanderson's complete 2002 draft of The Way of Kings, released so readers can see how radically a masterpiece can change: Kaladin is 'Merin', Roshar is recognizable but wrong in fascinating ways, and whole characters exist that never survived to publication. Not the canon story — something arguably more interesting: a 400,000-word window into revision itself.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2020","isPartOf":{"@type":"BookSeries","name":"Sanderson Curiosities"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.35,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":59,"item":{"@type":"Book","name":"The Original","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"An audio-original novella co-written with Mary Robinette Kowal: in a near-future city of body-editing and curated identity, a woman wakes as a Provisional Replica — a temporary copy legally created for one purpose: hunt down her original self, who has committed murder. She has four days of existence to do it. Twisty, philosophical, and brilliantly narrated.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2020","aggregateRating":{"@type":"AggregateRating","ratingValue":3.92,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":60,"item":{"@type":"Book","name":"Dawnshard","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Rysn — the trader with the flying pot-grown plant, quietly recurring since The Way of Kings — leads a voyage to Akinah, a dead city ringed by storms that no ship survives. What she finds there rewrites the Cosmere's deepest lore: the Dawnshards themselves. Also features the Lopen at maximum Lopen. A novella that starts as a trade mission and ends with some of the biggest revelations in the entire series.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2020","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.5,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/125085055X","https://coppermind.net/wiki/Dawnshard"]}},{"@type":"ListItem","position":61,"item":{"@type":"Book","name":"Rhythm of War","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Stormlight's fourth movement is its boldest: Urithiru falls to occupation, and while Kaladin — grounded by battle fatigue he can't outfly — wages a one-man resistance through the tower's corridors, Navani matches wits with the singer scientist Raboniel in a scholarly duel that is half collaboration, half war crime. A slower, more intimate volume about mental health, science, and songs — with an ending that detonates everything.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2020","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.61,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250757304","https://coppermind.net/wiki/Rhythm_of_War"]}},{"@type":"ListItem","position":62,"item":{"@type":"Book","name":"Lux","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A full-cast audio original set in the Reckoners universe, co-written with Steven Michael Bohls: Lux is a flying city harvested by Epics, and Jax, a teenage 'skyslicer', gets caught between its glittering surface and its rotten core. An expansion of the Steelheart world beyond David's story.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2021","isPartOf":{"@type":"BookSeries","name":"The Reckoners"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.26,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":63,"item":{"@type":"Book","name":"Sunreach","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The first Skyward Flight novella, co-written with Janci Patterson: when Detritus's shield leaves Spensa's friends behind, FM of Skyward Flight confronts the Superiority's kill order — and the taynix slugs everyone underestimated. FM's perspective adds a warmth the cockpit chapters never had room for.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2021","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.28,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":64,"item":{"@type":"Book","name":"ReDawn","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The second Skyward Flight novella, co-written with Janci Patterson: Alanik of ReDawn, the alien cytonic who crash-landed in Skyward, wakes among humans she doesn't trust while her own people slide toward Superiority control. Corrupted politics, tree cities, and the trilogy's best look at the war from non-human eyes.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2021","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.31,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":65,"item":{"@type":"Book","name":"Cytonic","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Spensa flies into the nowhere itself — the delvers' realm, where memories dissolve and time misbehaves — with only M-Bot and a scavenger pirate named Chet for company. A stranger, more mythic detour that answers what cytonics actually are, and what the delvers want. The weirdest and most divisive Skyward book, and proud of it.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2021","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.28,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/0399555854"]}},{"@type":"ListItem","position":66,"item":{"@type":"Book","name":"Evershore","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The third Skyward Flight novella, co-written with Janci Patterson: Jorgen — squadron leader, rule-follower, newly explosive cytonic — must lead a rescue on the kitsen homeworld of Evershore while grief tries to burn its way out of him. The strongest of the three novellas, and essential setup for Defiant.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2021","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.42,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":67,"item":{"@type":"Book","name":"Skyward Flight","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The three Skyward Flight novellas — Sunreach, ReDawn, and Evershore — collected in one volume, telling the story of what happened at home while Spensa was away. Co-written with Janci Patterson; read between Cytonic and Defiant for the full squadron picture.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2022","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.47,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":68,"item":{"@type":"Book","name":"Stephen Leeds: Death & Faxes","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"An audio-original return to Stephen Leeds, the man whose expertise lives in a committee of hallucinated specialists, taking on a new case that pushes his fractured method to its limits. A bonus epilogue-era story for Legion fans who weren't ready to let the aspects go.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2022","isPartOf":{"@type":"BookSeries","name":"Legion"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.12,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":69,"item":{"@type":"Book","name":"Bastille Versus the Evil Librarians","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The sixth and final Alcatraz book — narrated, at last, by Bastille, who has zero patience for Alcatraz's self-pitying cliffhanger from The Dark Talent and sets out to fix it herself. Co-written with Janci Patterson, it delivers the ending the series spent five books apologizing for not having. Sharp, funny, and genuinely satisfying.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2022","isPartOf":{"@type":"BookSeries","name":"Alcatraz Versus the Evil Librarians"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.38,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":70,"item":{"@type":"Book","name":"The Lost Metal","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Wax and Wayne era's finale: the anarchist Set tightens its grip, a bomb threatens Elendel, and the shadowy god Trell moves openly at last — pulling Scadrial into the Cosmere's wider war. Kelsier's Ghostbloods surface, worldhoppers walk the streets, and one beloved character gets the single best send-off Sanderson has ever written. The bridge between Mistborn's past and its space-age future.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2022","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.55,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/The_Lost_Metal"]}},{"@type":"ListItem","position":71,"item":{"@type":"Book","name":"White Sand Omnibus","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The complete Taldain story in its definitive form: all three White Sand graphic novels collected, with revised art, corrected story beats, and a unified presentation of Kenton's fight to save the sand masters. The recommended way to experience the Cosmere's sun-locked world.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2022","isPartOf":{"@type":"BookSeries","name":"White Sand"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.25,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":72,"item":{"@type":"Book","name":"Tress of the Emerald Sea","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Tress lives on a rock in a sea of spores that bloom into vines or explosions at a drop of water — and she likes her quiet life, until the boy she loves is taken by the fearsome Sorceress. So she stows away, acquires a talking rat, and crosses the deadly Emerald Sea to get him back. Narrated by Hoid in full Princess Bride mode, this is the warmest, most charming book in the Cosmere; the Secret Project that stole everyone's heart.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","aggregateRating":{"@type":"AggregateRating","ratingValue":4.55,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250899656","https://coppermind.net/wiki/Tress_of_the_Emerald_Sea"]}},{"@type":"ListItem","position":73,"item":{"@type":"Book","name":"Dark One: Forgotten","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A six-part audio drama co-written with Dan Wells: a true-crime podcaster investigates a serial killer that the world keeps forgetting — literally, memories of the case dissolve. A clever found-audio companion to the Dark One universe that works even if you never read the graphic novel.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","isPartOf":{"@type":"BookSeries","name":"Dark One"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.1,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":74,"item":{"@type":"Book","name":"The Frugal Wizard's Handbook for Surviving Medieval England","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A man wakes in a medieval village with no memory, a burned book, and the slow realization that he's standing in a purchased dimension — because in the future, you can buy your own alternate-history England (results may vary; read the handbook). Interleaved with cheerfully sinister corporate guidebook excerpts, this is the comedy Secret Project: light, twisty, and very funny about the multiverse-tourism industry.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","aggregateRating":{"@type":"AggregateRating","ratingValue":3.86,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250899672"]}},{"@type":"ListItem","position":75,"item":{"@type":"Book","name":"Yumi and the Nightmare Painter","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Yumi spends her days in ritual: stacking stones to summon the spirits her people depend on. Painter spends his nights in neon-soaked Kilahito, painting nightmares into harmless shapes. When their souls tangle across two worlds, each must live the other's impossible life. A body-swap romance by way of Final Fantasy X and Your Name — narrated by Hoid, and home to the most tear-jerking ending of the Secret Projects.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","aggregateRating":{"@type":"AggregateRating","ratingValue":4.66,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/isbn/1250899699","https://coppermind.net/wiki/Yumi_and_the_Nightmare_Painter"]}},{"@type":"ListItem","position":76,"item":{"@type":"Book","name":"The Sunlit Man","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"On Canticle, the sunrise melts stone — survival means flying ahead of the dawn, forever. Nomad, a battle-worn offworlder out of Investiture and out of options, crash-lands into a rebellion against the tyrant Cinder King. Fast, brutal, and relentless, this is the Secret Project for Stormlight fans: Nomad's identity and his Torment are deep-lore payoffs years in the making.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","aggregateRating":{"@type":"AggregateRating","ratingValue":4.53,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://coppermind.net/wiki/The_Sunlit_Man"]}},{"@type":"ListItem","position":77,"item":{"@type":"Book","name":"Defiant","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Skyward finale: Spensa knows what the delvers are, what the Superiority fears, and what her father's ghost cost her — now she has to end the war all of it started. Every squadmate, slug, and cytonic lesson pays off in a finale that brings humanity's exile full circle. Doomslug remains the series MVP.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.32,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":78,"item":{"@type":"Book","name":"Hyperthief","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A rare short story released as subscriber bonus content — one of the deep cuts in the Sanderson catalog, best approached as a curiosity for completionists collecting every published word.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","isPartOf":{"@type":"BookSeries","name":"Skyward"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.05,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":79,"item":{"@type":"Book","name":"Long Chills & Case Dough","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A detective-flavored novella released as subscriber bonus content — a stylistic experiment and collector's curiosity for readers determined to read absolutely everything Sanderson has published.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2023","isPartOf":{"@type":"BookSeries","name":"Sanderson Curiosities"},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.95,"bestRating":5,"worstRating":1,"ratingCount":1000}}},{"@type":"ListItem","position":80,"item":{"@type":"Book","name":"Dragonsteel Prime","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The novel Sanderson wrote in 1999-2000 — his original mythos, before the Cosmere was the Cosmere — released as a curiosity during the Words of Radiance leatherbound campaign. Its most famous export: the original Bridge Four, who fought here on the Shattered Plains years before The Way of Kings inherited them. Rough, fascinating, and historically essential for superfans.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","isPartOf":{"@type":"BookSeries","name":"Sanderson Curiosities"},"aggregateRating":{"@type":"AggregateRating","ratingValue":4.4,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/show/210529557-dragonsteel-prime"]}},{"@type":"ListItem","position":81,"item":{"@type":"Book","name":"The Most Boring Book Ever","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A picture book with Kazu Kibuishi (Amulet): the text insists, in a perfect deadpan, that nothing interesting is happening — while the illustrations show a boy's afternoon exploding into piratical, dragon-infested adventure. A joke about reading itself that kids get instantly and adults keep on the coffee table.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","aggregateRating":{"@type":"AggregateRating","ratingValue":4.5,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/show/207974153-the-most-boring-book-ever"]}},{"@type":"ListItem","position":82,"item":{"@type":"Book","name":"Wind and Truth","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The end of Stormlight's first arc: Dalinar has made a deal with a god — in ten days, a contest of champions decides Roshar's fate. Ten days, ten viewpoints, and every oath sworn since The Way of Kings called due. Kaladin takes on a mission unlike anything he's had before, Szeth returns home, and the final pages reshape the Cosmere's future. The biggest, most consequential Sanderson novel yet published.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"sameAs":["https://www.goodreads.com/book/isbn/1250319188","https://coppermind.net/wiki/Wind_and_Truth"]}},{"@type":"ListItem","position":83,"item":{"@type":"Book","name":"Isles of the Emberdark","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The fifth Secret Project: Sixth of the Dusk, decades after his novella, sails beyond Patji's shadow into the emberdark — the space between worlds — seeking salvation for his people as offworld powers close in. Starships meet Aviar, the Ones Above get names, and the Cosmere's space age truly begins. Gorgeously illustrated in its premium edition; the Tor trade edition arrives in 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2025","aggregateRating":{"@type":"AggregateRating","ratingValue":4.45,"bestRating":5,"worstRating":1,"ratingCount":1000},"sameAs":["https://www.goodreads.com/book/show/210300489-isles-of-the-emberdark","https://coppermind.net/wiki/Isles_of_the_Emberdark"]}},{"@type":"ListItem","position":84,"item":{"@type":"Book","name":"Tailored Realities","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A career-spanning collection of ten non-Cosmere stories — including Snapshot, Perfect State, Defending Elysium, Firstborn, and Mitosis — capped by Moment Zero, a brand-new ~200-page novella about two cops whose missing-persons case drops them into an alternate dimension of zombies and vampires. Each story comes with Sanderson's postscripts, old and new. The definitive tour of his science fiction.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2025","sameAs":["https://www.goodreads.com/book/show/222034397-tailored-realities"]}},{"@type":"ListItem","position":85,"item":{"@type":"Book","name":"Elsecaller","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A Stormlight side story featuring Jasnah Kholin, co-written with Dan Wells and set during Words of Radiance. First released as a collectible Stormlight Lost Tales Story Deck at Dragonsteel Nexus 2024, then in a print double-feature hardcover in December 2025. A treat for fans of the Cosmere's most formidable scholar.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"sameAs":["https://www.goodreads.com/book/show/244958810-elsecaller-king-lopen-the-first-of-alethkar"]}},{"@type":"ListItem","position":86,"item":{"@type":"Book","name":"King Lopen the First of Alethkar","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The Lopen explains, at length, why he would make an excellent king — to an increasingly regretful King Elhokar. A comedic Stormlight side story co-written with Isaac Stewart, first released as a Stormlight Lost Tales Story Deck at Dragonsteel Nexus 2024 and in print in December 2025. Exactly as gancho as it sounds.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"sameAs":["https://www.goodreads.com/book/show/244958810-elsecaller-king-lopen-the-first-of-alethkar"]}},{"@type":"ListItem","position":87,"item":{"@type":"Book","name":"The ChasmFriends Get A Pet!","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"A gleefully non-canonical Stormlight tale co-written with Dan Wells: the ChasmFriends navigate friendship, found family, and a pet shoutie that simply will not stop running away from perfectly reasonable greatshells. First released as a Lost Tales Story Deck at Dragonsteel Nexus 2024, and joining the illustrated Hoid's Storybook Collection in late 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","datePublished":"2024","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"}}},{"@type":"ListItem","position":88,"item":{"@type":"Book","name":"The Fires of December","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"Hoid's next tale: in a forgotten land sustained by rivers of demon blood, a young woman named December learns a plague is coming and sails up the River Violet to warn the king's court — armed with a talkative priestess, a fledgling fashion designer, and no patience for court intrigue. A standalone Cosmere novel in the Tress lineage; premium edition crowdfunding in 2026, wide release around Christmas 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Hoid's Travails"},"sameAs":["https://coppermind.net/wiki/The_Fires_of_December"]}},{"@type":"ListItem","position":89,"item":{"@type":"Book","name":"The Girl Who Looked Up","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The in-world fable from Oathbringer — a girl in a world half-lit, who climbs the impossible wall to learn what it keeps out — retold as an illustrated storybook with art by Howard Lyon. Part of the Hoid's Storybook Collection campaign (March 2026), shipping late 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Hoid's Storybook Collection"},"sameAs":["https://coppermind.net/wiki/The_Girl_Who_Looked_Up"]}},{"@type":"ListItem","position":90,"item":{"@type":"Book","name":"Wandersail","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The legend Hoid tells Kaladin in The Way of Kings: Derethil and his crew sail the Wandersail beyond the storms to the island of the Uvara, where no one is ever at fault — because the emperor commands everything. A parable about responsibility, retold as an illustrated storybook with art by Howard Lyon. Part of the Hoid's Storybook Collection, shipping late 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Hoid's Storybook Collection"},"sameAs":["https://coppermind.net/wiki/Wandersail"]}},{"@type":"ListItem","position":91,"item":{"@type":"Book","name":"The Dog and the Dragon","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The fable of a dog who wanted so badly to be a dragon that he worked, and worked, and worked — one of the stories Hoid tells on Roshar, retold as an illustrated storybook with art by Howard Lyon. Part of the Hoid's Storybook Collection campaign (March 2026), shipping late 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Hoid's Storybook Collection"}}},{"@type":"ListItem","position":92,"item":{"@type":"Book","name":"Horneater","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The upcoming Stormlight novella starring Rock: the Horneater bridgeman returns to his homeland in the Peaks — to family, consequences, and the airsick lowlander gods he left behind — set between Rhythm of War and Wind and Truth. A premium illustrated edition anchors the 2026 Hoid's Storybook Collection campaign, expected around Dragonsteel Nexus 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"sameAs":["https://www.goodreads.com/book/show/222842956-horneater","https://coppermind.net/wiki/Horneater"]}},{"@type":"ListItem","position":93,"item":{"@type":"Book","name":"Blightfall","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The first book of Riftwake, the new Cytoverse trilogy co-written with Janci Patterson that picks up after the Skyward saga. Humanity's war with the Superiority may be over, but the galaxy the delvers left behind is anything but settled. Scheduled for release September 1, 2026.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Riftwake"},"sameAs":["https://coppermind.net/wiki/Blightfall"]}},{"@type":"ListItem","position":94,"item":{"@type":"Book","name":"Riftwake Book Two (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The announced second entry in the Riftwake trilogy, co-written with Janci Patterson. Nothing but the series plan is public so far — no title, synopsis, or date. Listed here so you can watch the space.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Riftwake"},"sameAs":["https://coppermind.net/wiki/Cytoverse"]}},{"@type":"ListItem","position":95,"item":{"@type":"Book","name":"Riftwake Book Three (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The announced conclusion of the Riftwake trilogy, co-written with Janci Patterson. Only the trilogy commitment is known — no title or date has been revealed.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Riftwake"},"sameAs":["https://coppermind.net/wiki/Cytoverse"]}},{"@type":"ListItem","position":96,"item":{"@type":"Book","name":"Mistborn: Ghostbloods Book One (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The first book of Mistborn Era 3: Scadrial in a 1980s-analog age of skyscrapers, spycraft, and a Cold War between Elendel and the Southern Continent — with Kelsier's Ghostbloods at the center of it. Sanderson has called this trilogy his main novel focus after Wind and Truth, with Book One tentatively eyed for around 2028. Title not yet announced.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"sameAs":["https://coppermind.net/wiki/Ghostbloods_(trilogy)"]}},{"@type":"ListItem","position":97,"item":{"@type":"Book","name":"Mistborn: Ghostbloods Book Two (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The second book of the Mistborn Era 3 (Ghostbloods) trilogy, planned to follow Book One at roughly yearly intervals. No title, synopsis, or date yet — only the trilogy's place in Sanderson's published roadmap.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"sameAs":["https://coppermind.net/wiki/Ghostbloods_(trilogy)"]}},{"@type":"ListItem","position":98,"item":{"@type":"Book","name":"Mistborn: Ghostbloods Book Three (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The concluding volume of Mistborn Era 3 (Ghostbloods), planned to wrap the trilogy before Sanderson returns to the Stormlight Archive's back half. Nothing announced yet beyond its place in the sequence.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Mistborn"},"sameAs":["https://coppermind.net/wiki/Ghostbloods_(trilogy)"]}},{"@type":"ListItem","position":99,"item":{"@type":"Book","name":"The Stormlight Archive Book 6 (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The opening of the Stormlight Archive's back five: a new arc set years after Wind and Truth, planned to feature Lift's flashbacks. Sanderson has said it will be written after the Mistborn: Ghostbloods trilogy — so no title or date yet, but its place in the roadmap is locked.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"The Stormlight Archive"},"sameAs":["https://coppermind.net/wiki/The_Stormlight_Archive"]}},{"@type":"ListItem","position":100,"item":{"@type":"Book","name":"Elantris Sequel One (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The first of two long-promised Elantris sequels returning to Sel — a world whose fate matters increasingly to the wider Cosmere. Sanderson has repeatedly confirmed the plan, but no title, timeline, or synopsis exists yet.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Elantris"},"sameAs":["https://coppermind.net/wiki/Elantris_(series)"]}},{"@type":"ListItem","position":101,"item":{"@type":"Book","name":"Elantris Sequel Two (Untitled)","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The second announced Elantris sequel, intended to complete a Sel trilogy begun by Sanderson's very first published novel. Only the intent is known; everything else is still in the mists.","bookFormat":"https://schema.org/Hardcover","inLanguage":"en","isPartOf":{"@type":"BookSeries","name":"Elantris"},"sameAs":["https://coppermind.net/wiki/Elantris_(series)"]}},{"@type":"ListItem","position":102,"item":{"@type":"Book","name":"The Aztlanian","author":{"@type":"Person","name":"Brandon Sanderson"},"description":"The long-promised sequel to The Rithmatist, which would take Joel and Melody toward Aztlan and the source of the wild chalklings. Sanderson has said for years that he still wants to write it — and for years it has slipped down the queue. Only the title is known; there is currently no
