        <h1>Brandon Sanderson Books in Order — Complete Interactive Timeline</h1>
        <p>
          Every Brandon Sanderson book on one timeline: the Cosmere (Mistborn, The Stormlight
          Archive, Elantris, Warbreaker, the Secret Projects), the Cytoverse (Skyward, Riftwake),
          The Reckoners, Alcatraz, the Wheel of Time conclusions, and every announced upcoming
          release — including the Mistborn Ghostbloods trilogy, Stormlight Archive Book 6,
          Horneater, Blightfall, and The Fires of December. Release years, Goodreads ratings,
          recommended Cosmere reading order, and links to Coppermind, Goodreads, Amazon, and
          Audible for 104 works.
        </p>
        <h2>All 104 books by release date</h2>
        <ol>
        <li><h3>Elantris (Elantris #1) — released 2005</h3><p>Prince Raoden of Arelon wakes to find himself struck by the Shaod — the transformation that once made men gods and now leaves them undying wrecks — and is secretly cast into the rotting city of Elantris. While he fights to build hope inside a city of the damned, Princess Sarene of Teod arrives to discover her betrothed is 'dead' and takes on the scheming priest Hrathen, who has been given a hundred days to convert the kingdom or see it destroyed. Sanderson's debut novel is a self-contained tale of faith, politics, and a magic system with a broken heart, and it remains one of the best single-volume entry points into the Cosmere. Goodreads rating: 4.19/5.</p></li>
        <li><h3>The Hope of Elantris (Elantris #1.5) — released 2006</h3><p>A companion short story set during the climactic hours of Elantris, following Matisse, a young girl responsible for the children of New Elantris as soldiers descend on the city. It is a small, warm story about quiet heroism — the people who protect others while the heroes are busy saving the world. Best read after the novel, as it spoils its ending. Goodreads rating: 3.91/5.</p></li>
        <li><h3>Mistborn: The Final Empire (Mistborn #1) — released 2006</h3><p>For a thousand years ash has fallen from the sky, the Skaa have slaved in misery, and the immortal Lord Ruler has reigned unchallenged — until Kelsier, the only man to ever escape the Pits of Hathsin, decides to pull off the ultimate heist: overthrow God. He recruits Vin, a distrustful street thief who is only beginning to discover she is Mistborn, able to burn metals for superhuman power. Equal parts Ocean's Eleven and epic fantasy, The Final Empire is the perfect first Sanderson novel: a complete story with one of the most satisfying magic systems ever devised. Goodreads rating: 4.47/5.</p></li>
        <li><h3>The Well of Ascension (Mistborn #2) — released 2007</h3><p>The Lord Ruler is dead, and now comes the hard part: ruling. While Elend Venture tries to hold Luthadel with philosophy and a fragile assembly, three armies march on the city, the mists begin killing, and Vin is haunted by rumors of the Well of Ascension — and by a thumping power that calls her north. A masterclass in the question every revolution ignores: what do you do after you win? Goodreads rating: 4.38/5.</p></li>
        <li><h3>Alcatraz Versus the Evil Librarians (Alcatraz Versus the Evil Librarians #1) — released 2007</h3><p>On his thirteenth birthday, foster kid Alcatraz Smedry receives his inheritance: a bag of sand, which is promptly stolen by the evil Librarians who secretly control the world's information. It turns out his talent for breaking things is actually a magical Talent, his family are freedom fighters, and the sand is the key to everything. A gleefully absurd middle-grade comedy in which Sanderson mocks fantasy conventions, authors, and himself in equal measure. Goodreads rating: 3.96/5.</p></li>
        <li><h3>The Hero of Ages (Mistborn #3) — released 2008</h3><p>The world is literally ending: ash chokes the sky, the mists kill by day, and Ruin — the power Vin unknowingly freed — works to unmake everything. As Elend and Vin race to decode the Lord Ruler's hidden caches and Sazed grieves through a crisis of faith, every prophecy, plot thread, and offhand detail from the trilogy snaps into place. The Hero of Ages has one of the most celebrated endings in modern fantasy — an all-timer finale that recontextualizes everything before it. Goodreads rating: 4.51/5.</p></li>
        <li><h3>Alcatraz Versus the Scrivener's Bones (Alcatraz Versus the Evil Librarians #2) — released 2008</h3><p>Alcatraz infiltrates the Library of Alexandria — a deathtrap staffed by soul-hungry undead Curators — in search of his missing father and grandfather. Armed only with his Talent for breaking things and a family of eccentric Smedrys, he faces a half-metal hunter called the Scrivener's Bone. The jokes get better, the lore gets weirder, and the footnotes get more hostile. Goodreads rating: 4.09/5.</p></li>
        <li><h3>Defending Elysium — released 2008</h3><p>Centuries before Skyward, the Phone Company holds a monopoly on faster-than-light communication and humanity's uneasy place among the stars. Jason Write, a blind operative with senses far beyond sight, is sent to Elysium to contain an incident that could shatter the fragile peace with alien species. This novella quietly lays the foundations of the entire Cytoverse — cytonics, the Superiority's fear of humanity, all of it starts here. Goodreads rating: 4.12/5.</p></li>
        <li><h3>Firstborn — released 2008</h3><p>Dennison Crestmar was born to be a military genius — his brother Varion is the greatest admiral the High Empire has ever known, undefeated in every battle. Dennison, unfortunately, is hopeless. A sharp little space-opera short about living in a legend's shadow, and what an empire does when its perfect weapon stops obeying. Goodreads rating: 4.05/5.</p></li>
        <li><h3>Warbreaker — released 2009</h3><p>Two Idrian princesses are thrown into the vibrant, dangerous city of T'Telir: Siri, sent to marry the terrifying God King, and Vivenna, who follows to save her. Around them move Lightsong, a god who doesn't believe in his own divinity, and Vasher, a scruffy swordsman carrying Nightblood — a sentient blade created to destroy evil that is far too enthusiastic about its job. Warbreaker is Sanderson at his most colorful, literally: its BioChromatic magic runs on breath and color, and its ending reshapes what you thought the story was about. Goodreads rating: 4.38/5.</p></li>
        <li><h3>Alcatraz Versus the Knights of Crystallia (Alcatraz Versus the Evil Librarians #3) — released 2009</h3><p>Alcatraz finally reaches Nalhalla, the Free Kingdoms' capital, only to discover he is already famous — there are books about him, most of them wrong. Between celebrity, politics, and a treaty that would hand the kingdom of Mokia to the Librarians, he learns that being a legend is mostly paperwork and betrayal. The series' satire of fame and authorship at its sharpest. Goodreads rating: 4.16/5.</p></li>
        <li><h3>The Gathering Storm (The Wheel of Time #12) — released 2009</h3><p>The first of the three Wheel of Time volumes Sanderson completed from Robert Jordan's notes after his passing. As the Last Battle looms, Rand al'Thor hardens into something cold and dangerous while Egwene al'Vere, captive in the White Tower, wages a war of pure conviction against Elaida — and against a Seanchan raid that changes everything. Egwene's storyline here is widely considered one of the high points of the entire fourteen-book saga. Goodreads rating: 4.43/5.</p></li>
        <li><h3>The Way of Kings (The Stormlight Archive #1) — released 2010</h3><p>On the storm-wracked world of Roshar, where war is fought over shattered plains for gemhearts and honor is a forgotten word, three lives converge: Kaladin, a brilliant soldier betrayed into slavery who carries bridges into arrow-storms; Dalinar Kholin, a warlord haunted by visions commanding him to unite them; and Shallan, a scholar whose desperate theft hides a darker secret. The opening movement of the Stormlight Archive is a slow-burn masterpiece that builds to one of fantasy's great crescendos — Bridge Four alone is worth the page count. Goodreads rating: 4.65/5.</p></li>
        <li><h3>Towers of Midnight (The Wheel of Time #13) — released 2010</h3><p>The penultimate Wheel of Time volume. While Rand embraces a hard-won peace with himself, Perrin Aybara is hunted by Slayer and a looming trial, and Mat Cauthon gambles his way into the Tower of Ghenjei to pay a debt to the Aelfinn and Eelfinn. The board is set for the Last Battle; nearly every beloved character gets their moment to step into place. Goodreads rating: 4.52/5.</p></li>
        <li><h3>Alcatraz Versus the Shattered Lens (Alcatraz Versus the Evil Librarians #4) — released 2010</h3><p>The Librarians lay siege to Mokia, and Alcatraz — armed with exploding teddy bears and a Talent for breaking everything — decides the kingdom will not fall on his watch. Beneath the pink-bunny absurdity is a surprisingly sincere story about sacrifice, and the cliffhanger reveal stings for real. Goodreads rating: 4.23/5.</p></li>
        <li><h3>I Hate Dragons — released 2011</h3><p>A short comedy told almost entirely in dialogue: Skip is a squire whose scent is irresistible to dragons, which makes him the kingdom's most valuable — and most reluctant — piece of live bait. Originally written as a free writing-sample exercise, it's five minutes of pure Sanderson wit, complete with pedantic arguments about grammar mid-dragon-attack. Goodreads rating: 3.86/5.</p></li>
        <li><h3>Infinity Blade: Awakening (Infinity Blade #1.5) — released 2011</h3><p>Written as a bridge between the first two Infinity Blade video games: Siris has done the impossible and slain the God King, only to inherit his castle, his enemies, and the question of why the world's immortals have kept humanity in a medieval dark age. A fast, punchy tie-in novella that adds real mythology to the games' endless duels. Goodreads rating: 3.91/5.</p></li>
        <li><h3>The Alloy of Law (Mistborn #1) — released 2011</h3><p>Three centuries after the Mistborn trilogy, Scadrial has railroads, skyscrapers, and revolvers — and Waxillium Ladrian, a frontier lawman dragged back to the city to play lord. When a gang called the Vanishers starts robbing impossible trains and kidnapping noblewomen, Wax straps his guns back on alongside Wayne, fantasy's greatest hat-collecting con man. A breezy, banter-filled western that quietly sets up the future of the entire Cosmere. Goodreads rating: 4.19/5.</p></li>
        <li><h3>The Eleventh Metal (Mistborn #0.5) — released 2011</h3><p>Before Kelsier was the Survivor of Hathsin, he was an angry, newly Snapped Mistborn being trained by the half-mad Gemmel. This short story shows his first faltering steps with Allomancy — and the first hints of the plan that would one day topple an empire. Goodreads rating: 3.96/5.</p></li>
        <li><h3>Heuristic Algorithm and Reasoning Response Engine — released 2012</h3><p>A military science-fiction short co-written with Ethan Skarstedt for the Armored anthology: a soldier and his heavily armed mech AI partner drop into a warzone where the machine's rigid logic and the human's instincts have to learn to trust each other. A rare glimpse of Sanderson doing straight-up mech combat SF. Goodreads rating: 3.85/5.</p></li>
        <li><h3>Legion (Legion #1) — released 2012</h3><p>Stephen Leeds is perfectly sane — it's his hallucinations that are crazy. Every skill he has ever studied manifests as an 'aspect', a fully realized imaginary person who follows him around: a weapons expert, a linguist, a paranoid cryptographer. When he's hired to recover a camera that photographs the past, his internal committee gets its strangest case yet. A zippy, high-concept novella that reads like a TV pilot in the best way. Goodreads rating: 4.21/5.</p></li>
        <li><h3>The Emperor's Soul — released 2012</h3><p>Shai is a Forger, an artist who can rewrite an object's history with a stamp — a craft her captors call blasphemy right up until they need it. With the emperor brain-dead after an assassination attempt, she is given a hundred days to forge him a new soul, an impossible act of art and empathy performed under a death sentence. Winner of the Hugo Award for Best Novella and arguably the finest thing Sanderson has ever written. Goodreads rating: 4.46/5.</p></li>
        <li><h3>A Memory of Light (The Wheel of Time #14) — released 2013</h3><p>The Last Battle, at last. Every nation, every character, and every promise from fourteen volumes and twenty-three years converges on Tarmon Gai'don as Rand al'Thor walks into Shayol Ghul to face the Dark One. The single longest battle sequence in fantasy publishing, and a genuinely earned farewell to one of the genre's foundational sagas — completed by Sanderson from Robert Jordan's notes. Goodreads rating: 4.56/5.</p></li>
        <li><h3>The Rithmatist (The Rithmatist #1) — released 2013</h3><p>In a gearpunk alternate America of floating springrail trains, Rithmatists defend humanity by dueling with living two-dimensional chalk drawings. Joel, a chalkmaker's son at an elite academy, understands Rithmatic theory better than anyone — but wasn't chosen to use it. When students begin disappearing, leaving only blood and wild chalklings, he and the remedial Rithmatist Melody investigate. Sanderson's most inventive YA magic system, full stop. Goodreads rating: 4.22/5.</p></li>
        <li><h3>River of Souls (The Wheel of Time #14.5) — released 2013</h3><p>A deleted sequence from A Memory of Light, published in the Unfettered anthology: Demandred in the land of Shara, forging an empire and an army for the Last Battle under the name Bao the Wyld. Essential reading for anyone who finished the Wheel of Time asking 'where did HE come from?' Goodreads rating: 4.15/5.</p></li>
        <li><h3>Infinity Blade: Redemption (Infinity Blade #2.5) — released 2013</h3><p>The second Infinity Blade tie-in novella. Siris and the God King — enemies across a thousand duels — find themselves imprisoned together, while Isa investigates the mysterious Worker of Secrets and the true machinery behind their deathless world. Concludes the story between the games with genuine revelations about the setting's science-fantasy core. Goodreads rating: 4.11/5.</p></li>
        <li><h3>Steelheart (The Reckoners #1) — released 2013</h3><p>One day Calamity appeared in the sky, and ordinary people gained the powers of gods — and every single one of them became a monster. David Charleston watched the invincible Epic Steelheart murder his father, and he has spent ten years cataloguing the one thing no one else believes: every Epic has a weakness. Now he wants in with the Reckoners, the only humans still fighting back. Revenge-driven, gadget-filled superhero noir with a killer premise. Goodreads rating: 4.13/5.</p></li>
        <li><h3>Mitosis (The Reckoners #1.5) — released 2013</h3><p>A short Reckoners interlude between Steelheart and Firefight. Newcago's fragile freedom is tested by Mitosis, an Epic who can duplicate himself endlessly — and whose weakness is buried in something as fragile as a memory of music. A quick, satisfying bonus round for fans of the trilogy. Goodreads rating: 3.75/5.</p></li>
        <li><h3>Shadows for Silence in the Forests of Hell — released 2013</h3><p>On Threnody, the dead do not leave — the Forests are thick with shades that kill at the touch of fire, fast movement, or spilled blood. Silence Montane runs a waystop inn by day and collects bounties on the Forests' worst men by night, using the shades themselves as her weapon. A tense, horror-inflected novella that many readers rank among the Cosmere's very best short work. Goodreads rating: 4.24/5.</p></li>
        <li><h3>Words of Radiance (The Stormlight Archive #2) — released 2014</h3><p>The second Stormlight Archive volume turns everything up: Kaladin, now bodyguard to the very lighteyes he distrusts, wrestles with an oath that could break him; Shallan travels to the Shattered Plains carrying her family's ruin and a scholar's mission to stop the Voidbringers' return; and Szeth, the Assassin in White, comes for Dalinar. It builds through a duel gone wrong and a doomed expedition to a confrontation in a storm that fans still argue is the series' single best climax. Goodreads rating: 4.75/5.</p></li>
        <li><h3>Dreamer — released 2014</h3><p>A dark little short story from the Games Creatures Play anthology: disembodied spirits play a lethal game of tag across a city, stealing bodies like getaway cars. Short, nasty, and clever — Sanderson in rare horror mode. Goodreads rating: 3.52/5.</p></li>
        <li><h3>Sixth of the Dusk — released 2014</h3><p>On the island of Patji — a god that kills its worshippers — the trapper Dusk hunts with Aviar, birds whose companionship grants supernatural gifts. When he finds evidence that offworld traders are about to render his entire way of life extinct, he must decide what survival means for his people. A haunting far-future Cosmere novella about colonialism, tradition, and very smart birds. Goodreads rating: 4.3/5.</p></li>
        <li><h3>Allomancer Jak and the Pits of Eltania (Mistborn) — released 2014</h3><p>An in-world pulp adventure serial from Scadrial's broadsheets: the gentleman adventurer Allomancer Jak recounts his heroic escapades among the koloss — as annotated by his long-suffering Terris editor Handerwym, whose footnotes dismantle every exaggeration. The funniest thing in the Mistborn canon. Goodreads rating: 3.9/5.</p></li>
        <li><h3>The Way of Kings Prime (Sanderson Curiosities) — released 2014</h3><p>An excerpt from Sanderson's 2002 first attempt at The Way of Kings, published in the Altered Perceptions charity anthology. A fascinating artifact for Stormlight fans: same world, same names, radically different book. Goodreads rating: 4.3/5.</p></li>
        <li><h3>Legion: Skin Deep (Legion #2) — released 2014</h3><p>Stephen Leeds and his hallucinated aspects return to recover a stolen corpse whose cells have been encoded with data worth killing for. Biotech espionage, an assassin who knows exactly how to rattle Stephen's inner committee, and more of the aspects' bickering that made the first novella sing. Goodreads rating: 4.2/5.</p></li>
        <li><h3>Firefight (The Reckoners #2) — released 2015</h3><p>David killed Steelheart, and Newcago is free — but the answers he wants are in Babilar, the flooded, glowing ruin of Manhattan ruled by the water-wielding Epic Regalia. There he faces a harder question: if every Epic is corrupted by their power, what about Firefight, the one he can't stop thinking about? Bigger, stranger, and more neon than the first book. Goodreads rating: 4.25/5.</p></li>
        <li><h3>Perfect State — released 2015</h3><p>Kairominas is God-Emperor of his world: he has mastered its magic, conquered its kingdoms, and defeated his nemesis. He is also, technically, a brain in a jar — every human lives in their own tailored simulation, and the machines have decided it's time for him to meet a woman from another State. A sharp, twisty novella about power fantasies that knows exactly what it's poking at. Goodreads rating: 4.18/5.</p></li>
        <li><h3>Shadows of Self (Mistborn #2) — released 2015</h3><p>Wax and Wayne's second outing goes darker: a kandra — one of the immortal shapeshifters that served the Lord Ruler — has gone rogue, and its killings are engineered to set the city of Elendel on fire. The mystery is sharp, the banter is intact, and the final-page gut punch is one of the cruelest things Sanderson has ever done to a character (and to his readers). Goodreads rating: 4.31/5.</p></li>
        <li><h3>Elantris 10th Anniversary Edition — released 2015</h3><p>The definitive edition of Sanderson's debut, released for its tenth anniversary: revised text with author corrections, new maps of Sel, expanded annotations, and bonus material. If you're going to read Elantris today, this is the version to read. Goodreads rating: 4.22/5.</p></li>
        <li><h3>The Bands of Mourning (Mistborn #3) — released 2016</h3><p>A kandra researcher returns with images of the Bands of Mourning — the mythical metalminds of the Lord Ruler himself, said to grant anyone who wields them the full powers of a Mistborn. Wax, Wayne, Marasi, and the magnificent Steris head south into unexplored territory, where they find airships, new cultures, and revelations that blow the doors off Scadrial's future. Steris quietly steals the entire book. Goodreads rating: 4.4/5.</p></li>
        <li><h3>Mistborn: Secret History (Mistborn) — released 2016</h3><p>The story running underneath the original Mistborn trilogy, told from the other side of death. Saying more spoils both this and the trilogy — but if you've ever wanted to see the Cosmere's cosmology laid bare, this novella is where Sanderson finally shows his cards. Read it after The Bands of Mourning; the Survivor demands it. Goodreads rating: 4.39/5.</p></li>
        <li><h3>Calamity (The Reckoners #3) — released 2016</h3><p>The Reckoners finale: Prof, the man who taught David that Epics could be fought, has fallen to his own power. To save him, David leads the Reckoners against the salt-shifting city of Ildithia and toward Calamity itself — the source of every Epic and every corruption. Ends the trilogy with answers, audacity, and a very large number of explosions. Goodreads rating: 4.2/5.</p></li>
        <li><h3>White Sand Volume 1 (White Sand #1) — released 2016</h3><p>On Taldain, a world locked with one face to the sun, sand masters weave glowing ribbons of sand into weapons and tools. Kenton, the weakest sand master ever to take the trials, becomes the only one left standing when the entire Diem is massacred — and must claim its leadership or watch the art die. A graphic-novel adaptation of Sanderson's unpublished early novel and a Cosmere world you can't visit anywhere else. Goodreads rating: 3.85/5.</p></li>
        <li><h3>The Dark Talent (Alcatraz Versus the Evil Librarians #5) — released 2016</h3><p>Alcatraz's fifth misadventure takes him into the Highbrary — the Librarians' fortress vault hidden under Washington D.C. — to stop his own father's plan to give everyone Smedry Talents. The most self-aware book in a deeply self-aware series, and it ends on the cliff-hangeriest cliffhanger Sanderson has ever written (he apologizes for it constantly). Goodreads rating: 4.28/5.</p></li>
        <li><h3>Arcanum Unbounded (The Cosmere Collection #1) — released 2016</h3><p>The essential Cosmere collection: The Emperor's Soul, Shadows for Silence, Sixth of the Dusk, Mistborn: Secret History, the Stormlight novella Edgedancer, and more — each with an in-world essay on its star system by the worldhopper Khriss, plus original star charts. This is where the Cosmere's connective tissue becomes visible; casual readers become lore obsessives here. Goodreads rating: 4.54/5.</p></li>
        <li><h3>Edgedancer (The Stormlight Archive #2.5) — released 2016</h3><p>Lift — thief, pancake enthusiast, and the most reluctant Knight Radiant on Roshar — arrives in the city of Yeddaw with her invisible companion Wyndle, planning to steal food and avoid destiny. Instead she finds Darkness, the implacable herald-turned-executioner hunting people like her. The Cosmere's most joyful character in a novella that sneaks real emotional weight under the jokes. Read between Words of Radiance and Oathbringer. Goodreads rating: 4.25/5.</p></li>
        <li><h3>Snapshot — released 2017</h3><p>Detectives Davis and Chaz work inside Snapshots — perfect physical re-creations of a single past day, rebuilt so police can walk through crimes as they happened. When they stumble onto evidence of a murder nobody reported, the case starts bending the rules of what's real. A tight SF-noir novella with a final twist Sanderson fans still bring up. Goodreads rating: 3.95/5.</p></li>
        <li><h3>Oathbringer (The Stormlight Archive #3) — released 2017</h3><p>Dalinar Kholin unites the world's monarchs inside the ancient tower-city of Urithiru just as the Everstorm wakes an enemy that has waited millennia — and his own buried past begins to surface. The flashback thread here is devastating: the Blackthorn's true history recontextualizes the man trying to write a better ending for himself. Builds to the Battle of Thaylen Field and the single most quoted moment in the series: 'You cannot have my pain.' Goodreads rating: 4.62/5.</p></li>
        <li><h3>White Sand Volume 2 (White Sand #2) — released 2018</h3><p>Kenton's fight to save the Diem continues as political enemies circle and the investigation into the massacre deepens — while Khriss, the mysterious scholar from the world's darkside, pursues questions with Cosmere-sized answers. The middle chapter of the Taldain graphic novel trilogy. Goodreads rating: 3.9/5.</p></li>
        <li><h3>Legion: Lies of the Beholder (Legion #3) — released 2018</h3><p>The final Legion novella: Sandra — the woman who taught Stephen to control his aspects, then vanished — sends a message, and his carefully balanced inner world begins to collapse. A surprisingly moving finale about what happens when the imaginary people who keep you functional start to leave. Goodreads rating: 4.15/5.</p></li>
        <li><h3>Legion: The Many Lives of Stephen Leeds (Legion) — released 2018</h3><p>All three Legion novellas — Legion, Skin Deep, and Lies of the Beholder — collected in one volume: the complete case files of Stephen Leeds and the hallucinated experts who share his life. The ideal format for one of Sanderson's most purely fun non-Cosmere creations. Goodreads rating: 4.25/5.</p></li>
        <li><h3>Skyward (Skyward #1) — released 2018</h3><p>Spensa Nightshade has wanted to fly since childhood — but on the cavern-world Detritus, where humanity's remnant hides from alien bombardment, her dead father's name is a curse: coward. Clawing her way into flight school, she finds a decrepit talking starfighter named M-Bot, a slug that says 'doomslug', and the truth about what really happened in her father's final flight. Top Gun by way of epic fantasy pacing; the found-family squadron chapters are irresistible. Goodreads rating: 4.52/5.</p></li>
        <li><h3>Children of the Nameless — released 2018</h3><p>Sanderson's official Magic: The Gathering novella, free to read and beloved by both fandoms: when every soul in a village vanishes overnight, young Tacenda's cursed song leads her to Davriel Cane — a devastatingly lazy planeswalker who has contractually acquired several demons and would very much like to not be a hero. Wry, gothic, and set on Innistrad, MTG's horror plane. Goodreads rating: 4.33/5.</p></li>
        <li><h3>A Fire Within the Ways (The Wheel of Time #14.5) — released 2019</h3><p>A substantial deleted sequence from A Memory of Light, published in the Unfettered III anthology: Perrin's alternate storyline within the Ways during the Last Battle. A genuine lost chapter of the Wheel of Time's finale for completionists. Goodreads rating: 4.1/5.</p></li>
        <li><h3>White Sand Volume 3 (White Sand #3) — released 2019</h3><p>The conclusion of the Taldain trilogy: Kenton faces the final vote on the Diem's survival while assassins, politics, and the truth behind the massacre converge. Closes the graphic novel arc — and the Omnibus edition later revised and completed the story's definitive form. Goodreads rating: 4.02/5.</p></li>
        <li><h3>Starsight (Skyward #2) — released 2019</h3><p>Spensa gets the chance no human has had in decades: a stolen identity and a seat inside Starsight, the Superiority's gleaming space station, where 'aggressive' species like hers are caged. Undercover and utterly alone, she discovers her enemies have citizens, families — and their own terror: the delvers, planet-killing horrors from the nowhere. A sequel that risks everything by leaving Detritus behind, and wins the bet. Goodreads rating: 4.38/5.</p></li>
        <li><h3>Dark One Book 1 (Dark One #1) — released 2020</h3><p>Paul Tanasin has visions of Mirandus, a fantasy world where he is prophesied to become the Dark One — the destroyer. Rather than deny it, he decides to weaponize it. A graphic novel that inverts the chosen-one story: what if the boy of prophecy read the prophecy and said 'fine'? Moody art, sharp premise, and a very un-Sanderson edge. Goodreads rating: 4.14/5.</p></li>
        <li><h3>The Way of Kings Prime (Sanderson Curiosities) — released 2020</h3><p>Sanderson's complete 2002 draft of The Way of Kings, released so readers can see how radically a masterpiece can change: Kaladin is 'Merin', Roshar is recognizable but wrong in fascinating ways, and whole characters exist that never survived to publication. Not the canon story — something arguably more interesting: a 400,000-word window into revision itself. Goodreads rating: 4.35/5.</p></li>
        <li><h3>The Original — released 2020</h3><p>An audio-original novella co-written with Mary Robinette Kowal: in a near-future city of body-editing and curated identity, a woman wakes as a Provisional Replica — a temporary copy legally created for one purpose: hunt down her original self, who has committed murder. She has four days of existence to do it. Twisty, philosophical, and brilliantly narrated. Goodreads rating: 3.92/5.</p></li>
        <li><h3>Dawnshard (The Stormlight Archive #3.5) — released 2020</h3><p>Rysn — the trader with the flying pot-grown plant, quietly recurring since The Way of Kings — leads a voyage to Akinah, a dead city ringed by storms that no ship survives. What she finds there rewrites the Cosmere's deepest lore: the Dawnshards themselves. Also features the Lopen at maximum Lopen. A novella that starts as a trade mission and ends with some of the biggest revelations in the entire series. Goodreads rating: 4.5/5.</p></li>
        <li><h3>Rhythm of War (The Stormlight Archive #4) — released 2020</h3><p>Stormlight's fourth movement is its boldest: Urithiru falls to occupation, and while Kaladin — grounded by battle fatigue he can't outfly — wages a one-man resistance through the tower's corridors, Navani matches wits with the singer scientist Raboniel in a scholarly duel that is half collaboration, half war crime. A slower, more intimate volume about mental health, science, and songs — with an ending that detonates everything. Goodreads rating: 4.61/5.</p></li>
        <li><h3>Lux (The Reckoners) — released 2021</h3><p>A full-cast audio original set in the Reckoners universe, co-written with Steven Michael Bohls: Lux is a flying city harvested by Epics, and Jax, a teenage 'skyslicer', gets caught between its glittering surface and its rotten core. An expansion of the Steelheart world beyond David's story. Goodreads rating: 4.26/5.</p></li>
        <li><h3>Sunreach (Skyward #2.1) — released 2021</h3><p>The first Skyward Flight novella, co-written with Janci Patterson: when Detritus's shield leaves Spensa's friends behind, FM of Skyward Flight confronts the Superiority's kill order — and the taynix slugs everyone underestimated. FM's perspective adds a warmth the cockpit chapters never had room for. Goodreads rating: 4.28/5.</p></li>
        <li><h3>ReDawn (Skyward #2.2) — released 2021</h3><p>The second Skyward Flight novella, co-written with Janci Patterson: Alanik of ReDawn, the alien cytonic who crash-landed in Skyward, wakes among humans she doesn't trust while her own people slide toward Superiority control. Corrupted politics, tree cities, and the trilogy's best look at the war from non-human eyes. Goodreads rating: 4.31/5.</p></li>
        <li><h3>Cytonic (Skyward #3) — released 2021</h3><p>Spensa flies into the nowhere itself — the delvers' realm, where memories dissolve and time misbehaves — with only M-Bot and a scavenger pirate named Chet for company. A stranger, more mythic detour that answers what cytonics actually are, and what the delvers want. The weirdest and most divisive Skyward book, and proud of it. Goodreads rating: 4.28/5.</p></li>
        <li><h3>Evershore (Skyward #3.1) — released 2021</h3><p>The third Skyward Flight novella, co-written with Janci Patterson: Jorgen — squadron leader, rule-follower, newly explosive cytonic — must lead a rescue on the kitsen homeworld of Evershore while grief tries to burn its way out of him. The strongest of the three novellas, and essential setup for Defiant. Goodreads rating: 4.42/5.</p></li>
        <li><h3>Skyward Flight (Skyward) — released 2022</h3><p>The three Skyward Flight novellas — Sunreach, ReDawn, and Evershore — collected in one volume, telling the story of what happened at home while Spensa was away. Co-written with Janci Patterson; read between Cytonic and Defiant for the full squadron picture. Goodreads rating: 4.47/5.</p></li>
        <li><h3>Stephen Leeds: Death &amp; Faxes (Legion) — released 2022</h3><p>An audio-original return to Stephen Leeds, the man whose expertise lives in a committee of hallucinated specialists, taking on a new case that pushes his fractured method to its limits. A bonus epilogue-era story for Legion fans who weren't ready to let the aspects go. Goodreads rating: 4.12/5.</p></li>
        <li><h3>Bastille Versus the Evil Librarians (Alcatraz Versus the Evil Librarians #6) — released 2022</h3><p>The sixth and final Alcatraz book — narrated, at last, by Bastille, who has zero patience for Alcatraz's self-pitying cliffhanger from The Dark Talent and sets out to fix it herself. Co-written with Janci Patterson, it delivers the ending the series spent five books apologizing for not having. Sharp, funny, and genuinely satisfying. Goodreads rating: 4.38/5.</p></li>
        <li><h3>The Lost Metal (Mistborn #4) — released 2022</h3><p>The Wax and Wayne era's finale: the anarchist Set tightens its grip, a bomb threatens Elendel, and the shadowy god Trell moves openly at last — pulling Scadrial into the Cosmere's wider war. Kelsier's Ghostbloods surface, worldhoppers walk the streets, and one beloved character gets the single best send-off Sanderson has ever written. The bridge between Mistborn's past and its space-age future. Goodreads rating: 4.55/5.</p></li>
        <li><h3>White Sand Omnibus (White Sand) — released 2022</h3><p>The complete Taldain story in its definitive form: all three White Sand graphic novels collected, with revised art, corrected story beats, and a unified presentation of Kenton's fight to save the sand masters. The recommended way to experience the Cosmere's sun-locked world. Goodreads rating: 4.25/5.</p></li>
        <li><h3>Tress of the Emerald Sea — released 2023</h3><p>Tress lives on a rock in a sea of spores that bloom into vines or explosions at a drop of water — and she likes her quiet life, until the boy she loves is taken by the fearsome Sorceress. So she stows away, acquires a talking rat, and crosses the deadly Emerald Sea to get him back. Narrated by Hoid in full Princess Bride mode, this is the warmest, most charming book in the Cosmere; the Secret Project that stole everyone's heart. Goodreads rating: 4.55/5.</p></li>
        <li><h3>Dark One: Forgotten (Dark One) — released 2023</h3><p>A six-part audio drama co-written with Dan Wells: a true-crime podcaster investigates a serial killer that the world keeps forgetting — literally, memories of the case dissolve. A clever found-audio companion to the Dark One universe that works even if you never read the graphic novel. Goodreads rating: 4.1/5.</p></li>
        <li><h3>The Frugal Wizard's Handbook for Surviving Medieval England — released 2023</h3><p>A man wakes in a medieval village with no memory, a burned book, and the slow realization that he's standing in a purchased dimension — because in the future, you can buy your own alternate-history England (results may vary; read the handbook). Interleaved with cheerfully sinister corporate guidebook excerpts, this is the comedy Secret Project: light, twisty, and very funny about the multiverse-tourism industry. Goodreads rating: 3.86/5.</p></li>
        <li><h3>Yumi and the Nightmare Painter — released 2023</h3><p>Yumi spends her days in ritual: stacking stones to summon the spirits her people depend on. Painter spends his nights in neon-soaked Kilahito, painting nightmares into harmless shapes. When their souls tangle across two worlds, each must live the other's impossible life. A body-swap romance by way of Final Fantasy X and Your Name — narrated by Hoid, and home to the most tear-jerking ending of the Secret Projects. Goodreads rating: 4.66/5.</p></li>
        <li><h3>The Sunlit Man — released 2023</h3><p>On Canticle, the sunrise melts stone — survival means flying ahead of the dawn, forever. Nomad, a battle-worn offworlder out of Investiture and out of options, crash-lands into a rebellion against the tyrant Cinder King. Fast, brutal, and relentless, this is the Secret Project for Stormlight fans: Nomad's identity and his Torment are deep-lore payoffs years in the making. Goodreads rating: 4.53/5.</p></li>
        <li><h3>Defiant (Skyward #4) — released 2023</h3><p>The Skyward finale: Spensa knows what the delvers are, what the Superiority fears, and what her father's ghost cost her — now she has to end the war all of it started. Every squadmate, slug, and cytonic lesson pays off in a finale that brings humanity's exile full circle. Doomslug remains the series MVP. Goodreads rating: 4.32/5.</p></li>
        <li><h3>Hyperthief (Skyward #3.2) — released 2023</h3><p>A rare short story released as subscriber bonus content — one of the deep cuts in the Sanderson catalog, best approached as a curiosity for completionists collecting every published word. Goodreads rating: 4.05/5.</p></li>
        <li><h3>Long Chills &amp; Case Dough (Sanderson Curiosities) — released 2023</h3><p>A detective-flavored novella released as subscriber bonus content — a stylistic experiment and collector's curiosity for readers determined to read absolutely everything Sanderson has published. Goodreads rating: 3.95/5.</p></li>
        <li><h3>Dragonsteel Prime (Sanderson Curiosities) — released 2024</h3><p>The novel Sanderson wrote in 1999-2000 — his original mythos, before the Cosmere was the Cosmere — released as a curiosity during the Words of Radiance leatherbound campaign. Its most famous export: the original Bridge Four, who fought here on the Shattered Plains years before The Way of Kings inherited them. Rough, fascinating, and historically essential for superfans. Goodreads rating: 4.4/5.</p></li>
        <li><h3>The Most Boring Book Ever — released 2024</h3><p>A picture book with Kazu Kibuishi (Amulet): the text insists, in a perfect deadpan, that nothing interesting is happening — while the illustrations show a boy's afternoon exploding into piratical, dragon-infested adventure. A joke about reading itself that kids get instantly and adults keep on the coffee table. Goodreads rating: 4.5/5.</p></li>
        <li><h3>Wind and Truth (The Stormlight Archive #5) — released 2024</h3><p>The end of Stormlight's first arc: Dalinar has made a deal with a god — in ten days, a contest of champions decides Roshar's fate. Ten days, ten viewpoints, and every oath sworn since The Way of Kings called due. Kaladin takes on a mission unlike anything he's had before, Szeth returns home, and the final pages reshape the Cosmere's future. The biggest, most consequential Sanderson novel yet published.</p></li>
        <li><h3>Isles of the Emberdark — released 2025</h3><p>The fifth Secret Project: Sixth of the Dusk, decades after his novella, sails beyond Patji's shadow into the emberdark — the space between worlds — seeking salvation for his people as offworld powers close in. Starships meet Aviar, the Ones Above get names, and the Cosmere's space age truly begins. Gorgeously illustrated in its premium edition; the Tor trade edition arrives in 2026. Goodreads rating: 4.45/5.</p></li>
        <li><h3>Tailored Realities — released 2025</h3><p>A career-spanning collection of ten non-Cosmere stories — including Snapshot, Perfect State, Defending Elysium, Firstborn, and Mitosis — capped by Moment Zero, a brand-new ~200-page novella about two cops whose missing-persons case drops them into an alternate dimension of zombies and vampires. Each story comes with Sanderson's postscripts, old and new. The definitive tour of his science fiction.</p></li>
        <li><h3>Elsecaller (The Stormlight Archive) — released 2024</h3><p>A Stormlight side story featuring Jasnah Kholin, co-written with Dan Wells and set during Words of Radiance. First released as a collectible Stormlight Lost Tales Story Deck at Dragonsteel Nexus 2024, then in a print double-feature hardcover in December 2025. A treat for fans of the Cosmere's most formidable scholar.</p></li>
        <li><h3>King Lopen the First of Alethkar (The Stormlight Archive) — released 2024</h3><p>The Lopen explains, at length, why he would make an excellent king — to an increasingly regretful King Elhokar. A comedic Stormlight side story co-written with Isaac Stewart, first released as a Stormlight Lost Tales Story Deck at Dragonsteel Nexus 2024 and in print in December 2025. Exactly as gancho as it sounds.</p></li>
        <li><h3>The ChasmFriends Get A Pet! (The Stormlight Archive) — released 2024</h3><p>A gleefully non-canonical Stormlight tale co-written with Dan Wells: the ChasmFriends navigate friendship, found family, and a pet shoutie that simply will not stop running away from perfectly reasonable greatshells. First released as a Lost Tales Story Deck at Dragonsteel Nexus 2024, and joining the illustrated Hoid's Storybook Collection in late 2026.</p></li>
        <li><h3>The Fires of December (Hoid's Travails) — expected 2026</h3><p>Hoid's next tale: in a forgotten land sustained by rivers of demon blood, a young woman named December learns a plague is coming and sails up the River Violet to warn the king's court — armed with a talkative priestess, a fledgling fashion designer, and no patience for court intrigue. A standalone Cosmere novel in the Tress lineage; premium edition crowdfunding in 2026, wide release around Christmas 2026.</p></li>
        <li><h3>The Girl Who Looked Up (Hoid's Storybook Collection) — expected 2026</h3><p>The in-world fable from Oathbringer — a girl in a world half-lit, who climbs the impossible wall to learn what it keeps out — retold as an illustrated storybook with art by Howard Lyon. Part of the Hoid's Storybook Collection campaign (March 2026), shipping late 2026.</p></li>

        <li><h3>Riftwake Book Two (Untitled) (Riftwake #2) — announced, release date TBD</h3><p>The announced second entry in the Riftwake trilogy, co-written with Janci Patterson. Nothing but the series plan is public so far — no title, synopsis, or date. Listed here so you can watch the space.</p></li>
        <li><h3>Riftwake Book Three (Untitled) (Riftwake #3) — announced, release date TBD</h3><p>The announced conclusion of the Riftwake trilogy, co-written with Janci Patterson. Only the trilogy commitment is known — no title or date has been revealed.</p></li>
